# 出品した品の仕上げ（毎日）：項目を埋める → 競合で埋める → タイトルを80文字に近づける
# 11/25 07:24 オーナー「はい」（案2：項目を先に埋めてからタイトルを作る）・CLAUDE.md 21章
# 公開リポジトリ：プログラムだけ。台帳・記録・設定は非公開のデータ置き場（ebay-automation）を読み書きする。
# 公開のログには件数も品名も出さない（中身は data/ログ/ に保存して、データ置き場へ）
name: 出品した品の仕上げ
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
permissions:
  contents: read
concurrency:
  group: ledger-price_adjust
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ikkiota053128/ebay-automation
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data_repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 出品した品の仕上げ
        env:
          LEDGER_ROOT: ${{ github.workspace }}/data_repo
          LEDGER_JOURNAL: ${{ runner.temp }}/ledger_journal.json
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_SEND_TOKEN: ${{ secrets.GAS_SEND_TOKEN }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_RELAY_URL: ${{ secrets.RAKUTEN_RELAY_URL }}
          RAKUTEN_RELAY_TOKEN: ${{ secrets.RAKUTEN_RELAY_TOKEN }}
        run: |
          mkdir -p data_repo/data/ログ
          set_live() { python3 -c "import json,sys;p=sys.argv[1];d=json.load(open(p,encoding='utf-8')) if __import__('os').path.exists(p) else {};d.update(json.loads(sys.argv[2]));json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=1)" "$1" "$2"; }
          rc=0
          set_live data_repo/data/判定/項目の直し.json '{"本番": true, "件数": 1000}'
          python3 automation/aspect_fill.py > "data_repo/data/ログ/finish_aspect.log" 2>&1 || rc=$?
          set_live data_repo/data/判定/競合で埋める.json '{"本番": true, "件数": 1000, "時間の上限_分": 25}'
          python3 automation/comp_fill.py > "data_repo/data/ログ/finish_comp.log" 2>&1 || rc=$?
          set_live data_repo/data/判定/タイトルを埋める.json '{"本番": true, "件数": 1000, "やり直す": true}'
          python3 automation/title_fill.py > "data_repo/data/ログ/finish_title.log" 2>&1 || rc=$?
          echo "終わり（コード $rc）。中身はデータ置き場の data/ログ/finish_*.log"
          exit $rc
      - name: 台帳と記録をデータ置き場に保存
        if: always()
        working-directory: data_repo
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q origin/main -- 台帳.csv 2>/dev/null || true
            python3 ../automation/ledger_merge.py . "${{ runner.temp }}/ledger_journal.json" || exit 1
            git add data/ 台帳.csv 2>/dev/null || git add data/
            git diff --cached --quiet && exit 0
            git commit -q -m "${{ github.workflow }}：記録 $(TZ=Asia/Tokyo date '+%m/%d %H:%M') JST"
            git pull -q --rebase origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null; git pull -q --rebase -X theirs origin main && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5
          done
          echo "保存に失敗"; exit 1
